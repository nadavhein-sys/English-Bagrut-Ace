<title>מסלול אנגלית</title>
<style>
/* Layout: sticky scrolling tab bar over one centered column; home is a dashboard, games use full-width colour answer tiles */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --ink:#14213d; --muted:#5a6781; --line:#dbe3ee;
  --accent:#0b7a75; --accent-ink:#ffffff; --soft:#e3f1f0; --good:#1f8a4c; --bad:#c2412d; --warn:#b7791f;
  --xp:#e8a100; --xp-ink:#2b2000;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#43c0b8; --accent-ink:#08201f; --soft:#14343a; --good:#4cc27f; --bad:#ff8a76; --warn:#e7b25a;

:root[data-theme="dark"]{

  --accent:#43c0b8; --accent-ink:#08201f; --soft:#14343a; --good:#4cc27f; --bad:#ff8a76; --warn:#e7b25a;
  --xp:#ffc233; --xp-ink:#2b2000; --o1:#b8382a; --o2:#2a6fd1; --o3:#a87400; --o4:#23895a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
#wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-head);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:23px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
.he{direction:rtl;text-align:right}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 20px;font-weight:700;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.xp{background:var(--xp);color:var(--xp-ink)}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line)}
.pill.xp{background:var(--xp);color:var(--xp-ink);border-color:var(--xp)}
.pill svg{width:16px;height:16px;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--muted);white-space:nowrap;min-height:46px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.banner{background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.stack{display:grid;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.link{display:flex;flex-direction:column;gap:6px;text-align:right;color:var(--ink);cursor:pointer}

.tag{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stat b{display:block;font-family:var(--f-head);font-weight:400;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.xp i{background:var(--xp)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--xp) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-head);font-size:22px;font-variant-numeric:tabular-nums}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input[type=text],select,textarea{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:240px;direction:ltr;text-align:left}
.form{display:grid;gap:14px;max-width:440px}
/* חיפוש עם השלמה */
.combo{position:relative}
.combo input{font-size:18px;padding:14px 16px}
.list{position:absolute;inset-inline:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:320px;overflow:auto;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.list[hidden]{display:none}
.opt-i{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.opt-i:last-child{border-bottom:0}
.opt-i[aria-selected="true"],.opt-i:hover{background:var(--soft)}
.opt-i b{font-weight:500}
.opt-i mark{background:var(--xp);color:var(--xp-ink);border-radius:3px;padding:0 1px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:15px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* שיעור */
.rule{border-inline-start:3px solid var(--accent);padding:2px 14px;margin:10px 0}
.ex{display:grid;gap:2px;padding:8px 12px;background:var(--soft);border-radius:8px;margin:6px 0}
.bad{color:var(--bad)} .ok{color:var(--good)}
.passage{border-inline-start:3px solid var(--accent);padding:4px 16px;margin:12px 0 20px;background:var(--soft);border-radius:6px}
/* שאלות */
.opts{display:grid;gap:8px;margin:14px 0}
.opt{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.fb{padding:10px 14px;border-radius:10px;background:var(--soft);margin-bottom:14px}
/* משחקים */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{border:0;border-radius:12px;color:#fff;font-weight:700;font-size:18px;min-height:76px;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.tile:nth-child(1){background:var(--o1)} .tile:nth-child(2){background:var(--o2)} .tile:nth-child(3){background:var(--o3)} .tile:nth-child(4){background:var(--o4)}
.tile:disabled{opacity:.55}
.tile.right{opacity:1;outline:4px solid var(--good)}
.tile.wrong{opacity:.4}
@media(max-width:480px){.tiles{grid-template-columns:1fr}}
.bigq{font-family:var(--f-head);font-size:28px;text-align:center;margin:18px 0}
.hud{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.flash{perspective:900px;min-height:220px}
.flash button{width:100%;min-height:220px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);font-family:var(--f-head);font-size:34px;display:grid;place-items:center;padding:20px;gap:6px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:700px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mt{min-height:68px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;padding:8px;font-size:16px}
.mt.sel{border-color:var(--accent);background:var(--soft)}
.mt.done{visibility:hidden}
.mt.no{border-color:var(--bad)}
.chest{min-height:110px;border:0;border-radius:14px;background:var(--xp);color:var(--xp-ink);font-family:var(--f-head);font-size:20px}
.chest.open{background:var(--surface);color:var(--ink);border:2px solid var(--xp)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:.2}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

/* כתיבה */
.crit{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0}
.fix{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.wc{font-variant-numeric:tabular-nums;font-weight:700}
.wc.good{color:var(--good)} .wc.low{color:var(--warn)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
details.st{border-top:1px solid var(--line);padding:10px 0}
details.st summary{cursor:pointer;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:6px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.links{display:grid;gap:8px;padding:0;margin:8px 0 24px;list-style:none}
.picker{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.picker label{min-width:110px;flex:1}
a{color:var(--accent)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:700;text-align:center;z-index:9}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.avbtn{background:none;border:0;padding:0;border-radius:50%;line-height:0;min-height:0}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.nd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.nd.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nd.cur{border-color:var(--xp);color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--xp) 30%,transparent)}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0;color:var(--xp)}
.stars svg{width:38px;height:38px}
.stars .off{color:var(--line)}
.cel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:460px;margin-inline:auto;z-index:20;display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--xp);border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.cel[hidden]{display:none}
.cel-i{width:44px;height:44px;flex:none;color:var(--xp)}
.cel-i svg{width:100%;height:100%}
.cel-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--xp);font-weight:700}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.skin{display:grid;justify-items:center;gap:6px;padding:12px 8px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:center;font-size:14px}
.skin.sel{border-color:var(--accent)}
.skin.lock{opacity:.5;cursor:default}
.sw{display:block;width:48px;height:48px;border-radius:50%}
#wrap.th-sunset{--accent:#b4531a;--soft:#f6e6da}
#wrap.th-forest{--accent:#2f7d32;--soft:#e2f0e2}
#wrap.th-night{--accent:#2a6fd1;--soft:#e1ebfa}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) #wrap.th-sunset{--accent:#ff9a5a;--accent-ink:#1d0e00;--soft:#3a2415}
 :root:not([data-theme="light"]) #wrap.th-forest{--accent:#6fcf74;--accent-ink:#0b1f0c;--soft:#173a1a}
 :root:not([data-theme="light"]) #wrap.th-night{--accent:#7aa6ff;--accent-ink:#0a1530;--soft:#162a52}}
:root[data-theme="dark"] #wrap.th-sunset{--accent:#ff9a5a;--accent-ink:#1d0e00;--soft:#3a2415}
:root[data-theme="dark"] #wrap.th-forest{--accent:#6fcf74;--accent-ink:#0b1f0c;--soft:#173a1a}
:root[data-theme="dark"] #wrap.th-night{--accent:#7aa6ff;--accent-ink:#0a1530;--soft:#162a52}
</style>

const UNITS=[

function stagePrompt(p,n){
  const lv=LEVELS[P.level];
  return `You are an experienced Israeli English teacher writing practice items for ONE student.
Student: grade ${P.grade} (Israeli school system), level "${lv.name}" (CEFR ${lv.cefr}). Native language: Hebrew.
Topic: """${p.topic}"""
This is stage ${n} of ${STAGE_MAX} of a learning ladder. Stage ${n} focus: ${STAGES[n-1][1]}.
Write exactly 6 NEW multiple-choice questions (4 options each, exactly one correct answer), in the style of an Israeli English test, clearly harder than stage ${n-1||1}.
They must be completely different from the earlier questions. Do not reuse the same sentences, contexts or gap words. Earlier questions (do not repeat): ${p.recent.length?p.recent.join(' | '):'none'}
Use the student's world (school, friends, gaming, social media, sports, music, phones, Israeli daily life), never childish for grades 10-12. Stay within the vocabulary and grammar bands of the Israeli Ministry of Education for stage ${n} of this learner.
${QUALITY}
Return ONLY JSON: {"questions":[{"q":"...","options":["a","b","c","d"],"answer":0,"why_he":"short Hebrew explanation naming the rule"}]}`;
}
async function genStage(p,n){
  for(let attempt=0;attempt<2;attempt++){
    const r=await sample.json(stagePrompt(p,n),{modelTier:'default',cache:false});
    const qs=((r&&r.questions)||[]).filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.options[q.answer]!=null);
    const fresh=qs.filter(q=>!p.seen.includes(hash(q.q)));
    if(fresh.length>=4){
      const use=fresh.slice(0,6);addSeen(p,use.map(q=>q.q));
      return use.map(q=>({q:q.q,why:q.why_he||'',o:shuffle(q.options.map((t,i)=>({t:String(t),ok:i===q.answer})))}));
    }
  }
  throw {code:'gen'};
}

  if(!sample){ui.stage=null;render();toast('שלבים נוספים: '+NOAI);return}
  try{
    const qs=await genStage(p,n);
    persist();
    ui.stage={key,n,qs,qi:0,picked:null,score:0,state:'play'};
  }catch(e){
    ui.stage=null;
    toast(e&&e.code==='not_granted'?'כדי להמשיך צריך לאשר את הגישה ל-Claude':'לא הצלחנו להכין שלב חדש. אפשר לנסות שוב');
  }

function finishStage(){

function exportText(){
  const L=[];
  L.push('סיכום התקדמות · '+P.name+' · כיתה '+P.grade+' · '+LEVELS[P.level].name+' ('+LEVELS[P.level].cefr+')');
  L.push('XP: '+P.xp+' · רמה '+lvlOf(P.xp)+' · רצף: '+((P.streak&&P.streak.n)||0)+' ימים · מילים שנלמדו: '+words());
  const un=Object.keys(P.units||{}).map(id=>{const u=UNITS.find(x=>x.id===id);return u?u.title+' '+pct(P.units[id])+'%':null}).filter(Boolean);
  if(un.length)L.push('יחידות: '+un.join(', '));
  const pa=Object.values(P.paths||{}).map(x=>x.title+' (שלב '+x.stage+')');
  if(pa.length)L.push('מסלולים: '+pa.join(', '));

function unitCard(u){
  let st,cls;
  if(u.kind==='write'){const w=P.writing&&P.writing[u.id];st=w&&w.text?'נשלח '+when(w.ts):'טרם נכתב';cls=w&&w.text?'ok':'muted'}
  else{const r=P.units&&P.units[u.id];if(!r){st='טרם נעשה';cls='muted'}else{const p=pct(r);st=`הציון הטוב ביותר: ${p}%`;cls=p>=80?'ok':'warn'}}
  const n=u.kind==='write'?'משימת כתיבה':u.qs.length+' שאלות';
  const key='u:'+u.id,lad=u.kind==='quiz'?ladderHTML(key):'';

  const nxt=u.kind==='quiz'&&pathStage(key)>=1&&pathStage(key)<STAGE_MAX?`<span class="small">הבא: שלב ${pathStage(key)+1} · ${STAGES[pathStage(key)][0]}</span>`:'';

}

async function init(){
  let user=null;
  try{user=await window.claude?.use?.('user')}catch(e){}
  try{uid=user?await user.id():null;isOwner=!!(user&&user.isOwner())}catch(e){}
  try{db=await window.claude?.use?.('db')}catch(e){}
  try{sample=await window.claude?.use?.('sample')}catch(e){sample=null}
  if(db&&uid){
    try{ref=db.doc('students/'+uid);const s=await ref.get();if(s.exists)P=s.data();mode='cloud'}catch(e){mode='local'}
  }else mode='local';
  if(!P){try{P=JSON.parse(localStorage.getItem(LS)||localStorage.getItem('english-track-v1')||'null')}catch(e){}}
  if(P){P=normalize(P);ui.lvl=P.level}
  if(STANDALONE)bannerMsg='ההתקדמות נשמרת במכשיר הזה בלבד. בלשונית "הישגים" אפשר להעתיק סיכום התקדמות ולשלוח אותו למורה.';
  else if(mode==='local'&&!isOwner)bannerMsg='ההתקדמות נשמרת רק במכשיר הזה. כדי שהמורה יראה אותה, יש לפתוח את הקישור שנשלח מהמורה ולהתחבר לחשבון.';
  if(mode==='cloud'){db.collection('league').where('week','==',weekId()).onSnapshot(s=>{league=s.docs.map(d=>({id:d.id,...d.data()}));if(ui.view==='league'&&!ui.game&&!ui.quiz)render()},()=>{})}
  if(isOwner&&db){db.collection('students').onSnapshot(s=>{roster=s.docs.map(d=>({id:d.id,...d.data()}));if(ui.view==='teacher'&&!ui.game&&!ui.quiz)render()},()=>{})}
  render();
}

function matches(q){
  q=q.trim().toLowerCase();if(!q)return [];
  return TOPICS.filter(t=>t[0].toLowerCase().includes(q)||t[1].includes(q)).slice(0,8);
}
function hl(s,q){const i=s.toLowerCase().indexOf(q.toLowerCase());if(i<0||!q)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))}
function bindCombo(){
  const inp=document.getElementById('tq'),lst=document.getElementById('tl');if(!inp)return;
  let sel=-1,cur=[];
  const draw=()=>{
    const q=inp.value.trim();ui.topicQ=inp.value;
    cur=matches(q);sel=-1;
    if(!q){lst.hidden=true;inp.setAttribute('aria-expanded','false');return}
    lst.innerHTML=cur.map((t,i)=>`<div class="opt-i" role="option" id="o${i}" data-i="${i}" aria-selected="false"><b class="en">${hl(t[0],q)}</b><span class="muted small">${hl(t[1],q)}</span></div>`).join('')+
      `<div class="opt-i" role="option" id="oc" data-i="free" aria-selected="false"><b>שיעור על: <span class="en">${esc(q)}</span></b></div>`;
    lst.hidden=false;inp.setAttribute('aria-expanded','true');
  };
  const mark=()=>{[...lst.children].forEach((c,i)=>c.setAttribute('aria-selected',String(i===sel)));if(sel>=0)inp.setAttribute('aria-activedescendant',lst.children[sel].id)};
  inp.addEventListener('input',draw);inp.addEventListener('focus',draw);
  inp.addEventListener('keydown',e=>{
    const n=lst.children.length;
    if(e.key==='ArrowDown'){e.preventDefault();if(n){sel=(sel+1)%n;mark()}}
    else if(e.key==='ArrowUp'){e.preventDefault();if(n){sel=(sel-1+n)%n;mark()}}
    else if(e.key==='Escape'){lst.hidden=true}
    else if(e.key==='Enter'&&sel>=0){e.preventDefault();const t=cur[sel];startLesson(t?t[0]:inp.value.trim())}
  });
  lst.addEventListener('mousedown',e=>{const o=e.target.closest('.opt-i');if(!o)return;e.preventDefault();const t=cur[+o.dataset.i];startLesson(t?t[0]:inp.value.trim())});
  document.getElementById('tf').addEventListener('submit',e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;startLesson(cur[0]&&cur[0][0].toLowerCase()===v.toLowerCase()?cur[0][0]:v)});
}
function lessonPrompt(topic){
  const lv=LEVELS[P.level];
  return `You are an experienced Israeli English teacher preparing a short lesson for ONE student.
Student: grade ${P.grade} (Israeli school system), level "${lv.name}" (CEFR ${lv.cefr}). Native language: Hebrew.
Topic requested by the student: """${topic}"""
Rules:
- If the topic is not about learning English (language, grammar, vocabulary, reading, writing, listening, pronunciation, exams), set "off_topic": true and leave the other fields empty.
- Explanations are in simple Hebrew suited to the grade; all English examples are natural and use the student's world (school, friends, gaming, social media, sports, music, phones, Israeli daily life), never childish for grades 10-12.
- Respect the Israeli Ministry of Education vocabulary and grammar bands for this level: do not use words well above ${lv.cefr}.
- Mention typical mistakes of Hebrew speakers for this topic when relevant.
- Quiz: exactly 6 multiple-choice questions, in the style of an Israeli English test, 4 options each, one correct answer, increasing difficulty.
Return ONLY a JSON object with this shape:
{"off_topic":false,"title":"English title","title_he":"כותרת בעברית","intro_he":"2-3 sentences","rules":[{"rule_he":"...","examples":[{"en":"...","he":"..."}]}],"mistakes":[{"wrong":"...","right":"...","why_he":"..."}],"tips_he":["..."],"quiz":[{"q":"...","options":["a","b","c","d"],"answer":0,"why_he":"..."}]}
Give 2-4 rules with 2 examples each, 2-3 mistakes, 2-3 tips.
LANGUAGE QUALITY RULES (very important):
- All English must be natural, idiomatic, correct and proofread. Time expressions follow natural order and format: "Yesterday at 4 p.m." or "At 4 p.m. yesterday" (use p.m./a.m. or o'clock), never "At 4:00 yesterday". Never mix tenses inside an example. Check every example sentence against the rule it illustrates.
- All Hebrew must be clear, correct, modern standard Hebrew in short sentences, not translated word-for-word from English. Address students in a gender-neutral way (plural, infinitive or impersonal), never with "אתה" or "את".
- Before returning, re-read every sentence once and fix any error.
`;
}
async function startLesson(topic){
  topic=topic.replace(/\s+/g,' ').trim().slice(0,80);if(!topic)return;
  ui.lesson={mode:'loading',topic};
  app.innerHTML=`<div class="card" style="text-align:center;padding:40px 16px"><div class="spinner" aria-hidden="true"></div><h2 style="margin-top:14px" class="en">${esc(topic)}</h2><p class="muted">מכינים שיעור ותרגול. זה ייקח כמה שניות.</p></div>`;
  if(!sample){ui.lesson=null;bannerMsg='';render();toast('שיעורים בנושא חופשי: '+NOAI);return}
  try{
    const r=await sample.json(lessonPrompt(topic),{modelTier:'default'});
    if(!r||r.off_topic||!Array.isArray(r.quiz)||r.quiz.length<3)throw {code:'off'};
    const quizRaw=r.quiz.filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.options[q.answer]!=null).map(q=>({q:q.q,why:q.why_he||'',o:shuffle(q.options.map((t,i)=>({t:String(t),ok:i===q.answer})))}));
    const quiz=quizRaw;
    {const pa=ensurePath(slug(topic),r.title||topic,topic);addSeen(pa,quiz.map(q=>q.q))}
    ui.lesson={mode:'view',topic,data:r,quiz,qi:0,picked:null,score:0,done:false};
    P.topics=[{t:topic,ts:Date.now()}].concat((P.topics||[]).filter(x=>x.t.toLowerCase()!==topic.toLowerCase())).slice(0,12);persist();
    addXP(5,'שיעור חדש');
  }catch(e){
    ui.lesson=null;ui.view='topics';render();
    toast(e&&e.code==='off'?'הנושא אינו קשור ללימוד אנגלית. אפשר לנסות נושא אחר.':e&&e.code==='not_granted'?'כדי ליצור שיעור צריך לאשר את הגישה ל-Claude':'לא הצלחנו להכין את השיעור. אפשר לנסות שוב.');
    return;
  }
  render();window.scrollTo(0,0);
}

/* ======================================================= מקורות לשאלות (אוצר מילים + יחידות) ======================================================= */
function allSources(){
  return VSETS.map(s=>({id:'v:'+s.id,label:BANDS[s.band].name+' · '+s.title,vocab:true,set:s})).concat(UNITS.filter(u=>u.kind==='quiz').map(u=>({id:'u:'+u.id,label:LEVELS[u.lvl].cefr+' · '+u.title,vocab:false,unit:u})));
}
function srcById(id){return allSources().find(s=>s.id===id)}
function vocabItems(set,n,flip){
  const pool=VSETS.filter(s=>s.band===set.band).flatMap(s=>s.w);
  return shuffle(set.w).slice(0,n||set.w.length).map(([en,he],i)=>{
    const toHe=(i%2===0)!==!!flip;
    const dis=shuffle(pool.filter(w=>w[0]!==en)).slice(0,3);
    return toHe?{q:en,qdir:'en',say:en,o:shuffle([{t:he,ok:true}].concat(dis.map(d=>({t:d[1],ok:false})))),odir:'he',why:`${en} = ${he}`,w:en}
              :{q:he,qdir:'he',o:shuffle([{t:en,ok:true}].concat(dis.map(d=>({t:d[0],ok:false})))),odir:'en',why:`${he} = ${en}`,w:en};
  });
}
function unitItems(u){return u.qs.map(q=>({q:q.q,qdir:'en',o:shuffle(q.o.map((t,k)=>({t,ok:k===0}))),odir:'en',why:q.why}))}
function itemsFor(src,n){
  if(src.vocab)return vocabItems(src.set,n);
  return shuffle(unitItems(src.unit));
}
function srcSelect(id,sel){
  const g=[1,2,3].map(b=>`<optgroup label="${BANDS[b].name}">${allSources().filter(s=>s.vocab&&s.set.band===b).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.label)}</option>`).join('')}</optgroup>`).join('');
  const u=`<optgroup label="יחידות דקדוק והבנת הנקרא">${allSources().filter(s=>!s.vocab).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.label)}</option>`).join('')}</optgroup>`;
  return `<select id="${id}">${g}${u}</select>`;
}

/* ======================================================= אוצר מילים ======================================================= */
function known(w){return (P.vocab&&P.vocab[w])||0}

  const b=ui.vband||Math.min(P.level,3);
  const sets=VSETS.filter(s=>s.band===b);
  const totW=sets.reduce((a,s)=>a+s.w.length,0),kn=sets.reduce((a,s)=>a+s.w.filter(w=>known(w[0])>=2).length,0);
  return `<div class="stack"><div><h2>אוצר מילים לפי Bands של משרד החינוך</h2>
  <p class="muted">המילים נבחרו מתוך רשימות Lexical Band I–III הרשמיות. הרשימות המלאות זמינות בלשונית "חומרי משרד החינוך".</p></div>
  <div class="cats" role="group" aria-label="בחירת Band">${[1,2,3].map(x=>`<button class="chip" aria-pressed="${b===x}" data-act="vband" data-v="${x}">${BANDS[x].name}</button>`).join('')}</div>
  <div class="row spread"><span class="muted">${BANDS[b].sub}</span><span class="small">נלמדו ${kn} מתוך ${totW} מילים ב-${BANDS[b].name} הזה</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${Math.round(100*kn/totW)}%"></i></div>
  <div class="grid">${sets.map(s=>{const k=s.w.filter(w=>known(w[0])>=2).length;return `<div class="card"><div class="tag">${k}/${s.w.length} נלמדו</div><h3>${esc(s.title)}</h3>
   <div class="bar" style="margin:10px 0"><i style="width:${Math.round(100*k/s.w.length)}%"></i></div>
   <div class="row"><button class="btn" data-act="gostart" data-v="cards|v:${s.id}">כרטיסיות</button><button class="btn ghost" data-act="gostart" data-v="match|v:${s.id}">התאמה</button><button class="btn ghost" data-act="gostart" data-v="blitz|v:${s.id}">בליץ</button><button class="btn ghost" data-act="gostart" data-v="spell|v:${s.id}">איות</button></div></div>`}).join('')}</div>
  </div>`;
}

/* ======================================================= משחקים ======================================================= */
const GAMES=[
 {k:'blitz',n:'בליץ',d:'60 שניות כדי לענות נכון על כמה שיותר שאלות. רצף של תשובות נכונות מעלה את הניקוד.',any:true},
 {k:'gold',n:'מסע הזהב',d:'כל תשובה נכונה פותחת תיבת אוצר. אוספים זהב ומנסים לנצח את רובו, הרובוט.',any:true},
 {k:'cards',n:'כרטיסיות',d:'מפעילים כרטיס ובודקים אם ידעתם את התרגום. מילים שלא ידעתם חוזרות.',any:false},
 {k:'match',n:'התאמה',d:'מחברים כל מילה לתרגום שלה, הכי מהר שאפשר.',any:false},
 {k:'spell',n:'איות',d:'קוראים את המשמעות בעברית וכותבים את המילה באנגלית. אפשר גם להקשיב לה.',any:false}
];
function gamesHTML(){
  const sel=ui.gsrc||'v:'+VSETS.find(s=>s.band===Math.min(P.level,3)).id;
  const src=srcById(sel);
  return `<div class="stack"><div><h2>משחקים</h2><p class="muted">בוחרים חומר ומשחק. כל משחק מזכה ב-XP.</p></div>
  <label class="f" for="gs">החומר לתרגול</label>${srcSelect('gs',sel)}
  <div class="grid">${GAMES.map(g=>{const dis=!src.vocab&&!g.any;const b=P.best&&P.best[g.k+':'+sel];return `<button class="card link" ${dis?'disabled style="opacity:.5;cursor:default"':''} data-act="gostart" data-v="${g.k}|${sel}"><h3>${g.n}</h3><span class="muted small">${g.d}</span>${dis?'<span class="tag">זמין רק לאוצר מילים</span>':b?`<span class="tag">שיא אישי: ${b}</span>`:''}</button>`}).join('')}</div></div>`;
}
function startGame(kind,srcId){
  const src=srcById(srcId);if(!src)return;
  stopTimer();
  const base={kind,src:srcId,xp:0};
  if(kind==='blitz'){ui.game=Object.assign(base,{pool:[],i:0,score:0,streak:0,right:0,left:60,picked:null,over:false});refill();ui.game.t0=Date.now();ui.timer=setInterval(tick,250)}
  else if(kind==='gold'){const items=itemsFor(src,12);ui.game=Object.assign(base,{items,i:0,gold:0,bot:0,mult:1,picked:null,chests:null,over:false,right:0})}
  else if(kind==='cards'){const w=shuffle(src.set.w);ui.game=Object.assign(base,{deck:w.map(x=>x.slice()),flip:false,total:w.length,knownN:0,again:0})}
  else if(kind==='match'){const w=shuffle(src.set.w).slice(0,6);const tiles=shuffle(w.flatMap(x=>[{k:x[0],t:x[0],l:'en'},{k:x[0],t:x[1],l:'he'}]));ui.game=Object.assign(base,{tiles,sel:null,done:0,moves:0,t0:null,sec:0,over:false,bad:null,lock:false});ui.timer=setInterval(()=>{if(ui.game&&ui.game.t0&&!ui.game.over){ui.game.sec=Math.floor((Date.now()-ui.game.t0)/1000);const e=document.getElementById('mt');if(e)e.textContent=ui.game.sec}},500)}
  else if(kind==='spell'){const w=shuffle(src.set.w).slice(0,10);ui.game=Object.assign(base,{w,i:0,right:0,tries:0,hint:false,fb:null,over:false})}
  render();window.scrollTo(0,0);
}
function refill(){const g=ui.game,src=srcById(g.src);g.pool=itemsFor(src,src.vocab?src.set.w.length:undefined)}
/* מילה או שאלה שנענתה לא נכון חוזרת פעם אחת בסוף הסבב, עם תשובות מעורבבות מחדש. מה שנענה נכון לא חוזר. */
function redo(srcId,it){
  const src=srcById(srcId);
  if(src.vocab&&it.w){const pair=src.set.w.find(x=>x[0]===it.w);if(pair){const n=vocabItems({band:src.set.band,w:[pair]},1,it.qdir==='en')[0];n.again=true;return n}}
  return Object.assign({},it,{o:shuffle(it.o),again:true});
}
function tick(){
  const g=ui.game;if(!g||g.kind!=='blitz'||g.over)return;
  g.left=Math.max(0,60-Math.floor((Date.now()-g.t0)/1000));
  const e=document.getElementById('bt');if(e)e.textContent=g.left;
  const b=document.getElementById('bb');if(b)b.style.width=(g.left/60*100)+'%';
  if(g.left<=0)endGame();
}
function endGame(){
  const g=ui.game;if(!g||g.over)return;g.over=true;stopTimer();
  let xp=0,key=g.kind+':'+g.src,score=0;
  if(g.kind==='blitz'){if(g.cleared)g.score+=g.left*10;score=g.score;xp=Math.min(60,Math.round(g.score/40))}
  else if(g.kind==='gold'){score=g.gold;xp=8+Math.min(30,Math.round(g.gold/30))+(g.gold>g.bot?8:0)}
  else if(g.kind==='match'){score=Math.max(0,300-g.sec*4-g.moves*3);xp=10+Math.min(15,Math.round(score/20));srcById(g.src).set.w.forEach(w=>{if(g.tiles.some(t=>t.k===w[0]))P.vocab[w[0]]=Math.min(3,known(w[0])+1)})}
  else if(g.kind==='spell'){score=g.right;xp=g.right*3}
  g.gainXP=xp;
  if(!P.best)P.best={};
  if(score>(P.best[key]||0)){P.best[key]=score;g.record=true}
  g.score2=score;
  if(!P.stats)P.stats={};
  if(g.kind==='gold'&&g.gold>g.bot)P.stats.goldWins=(P.stats.goldWins||0)+1;
  if(g.kind==='blitz'&&g.cleared)P.stats.blitzCleared=(P.stats.blitzCleared||0)+1;
  addXP(xp);persist();
  if(ui.game===g)render();
}
function gameHead(title){return `<div class="row spread" style="margin-bottom:12px"><button class="btn ghost" data-act="gexit">יציאה</button><strong>${title}</strong><span></span></div>`}
function resultCard(title,main,sub){
  const g=ui.game;
  return `${gameHead(title)}<div class="card pop" style="text-align:center"><div class="stat"><b>${main}</b><span class="muted">${sub}</span></div>
  <p style="margin:12px 0"><span class="pill xp">${IC.bolt}+${g.gainXP||0} XP</span> ${g.record?'<span class="pill">שיא אישי חדש</span>':''}</p>
  <div class="row" style="justify-content:center"><button class="btn" data-act="gostart" data-v="${g.kind}|${g.src}">שוב</button><button class="btn ghost" data-act="gexit">לרשימה</button></div></div>`;
}
function qBlock(it){
  return `<div class="bigq ${it.qdir==='he'?'he':'en'}" style="${it.qdir==='he'?'direction:rtl;text-align:center':'text-align:center'}">${esc(it.q)}${it.say?` <button class="btn ghost" data-act="say" data-v="${esc(it.say)}" aria-label="השמע" style="min-height:36px;padding:2px 10px">▶</button>`:''}</div>`;
}
function renderGame(){
  const g=ui.game;
  if(g.kind==='blitz')return renderBlitz();
  if(g.kind==='gold')return renderGold();
  if(g.kind==='cards')return renderCards();
  if(g.kind==='match')return renderMatch();
  if(g.kind==='spell')return renderSpell();
}
/* בליץ */
function renderBlitz(){
  const g=ui.game;
  if(g.over){app.innerHTML=resultCard('בליץ',g.score,g.cleared?`סיימתם את כל החומר, ${g.right} תשובות נכונות`:`${g.right} תשובות נכונות`);return}
  const it=g.pool[g.i];
  app.innerHTML=`${gameHead('בליץ')}<div class="hud"><span class="pill xp">${IC.bolt}${g.score}</span><span class="pill">${IC.fire}x${Math.min(5,1+Math.floor(g.streak/3))}</span><span class="pill" id="bt">${g.left}</span></div>
  <div class="bar" style="margin-top:10px"><i id="bb" style="width:${g.left/60*100}%"></i></div>
  ${qBlock(it)}
  <div class="tiles">${it.o.map((o,k)=>`<button class="tile ${it.odir==='he'?'he':'en'} ${g.picked!==null?(o.ok?'right':(k===g.picked?'wrong':'')):''}" data-act="bpick" data-v="${k}" ${g.picked!==null?'disabled':''} style="${it.odir==='he'?'direction:rtl':'direction:ltr'}">${esc(o.t)}</button>`).join('')}</div>
  ${g.picked!==null&&!it.o[g.picked].ok?`<div class="fb" role="status">${esc(it.why)}</div>`:''}`;
}
function bpick(k){
  const g=ui.game;if(g.picked!==null||g.over)return;
  const it=g.pool[g.i];g.picked=k;
  if(it.o[k].ok){g.streak++;g.right++;g.score+=100*Math.min(5,1+Math.floor((g.streak-1)/3));if(it.w)P.vocab[it.w]=Math.min(3,known(it.w)+(g.right%3===0?1:0))}
  else{g.streak=0;if(!it.again)g.pool.push(redo(g.src,it))}
  render();
  setTimeout(()=>{if(ui.game!==g||g.over)return;g.picked=null;g.i++;if(g.i>=g.pool.length){g.cleared=true;endGame();return}render()},it.o[k].ok?450:1400);
}

function deduction(T,n){for(const [from,pts] of T.ded){if(n>=from&&n<T.min)return pts}return 0}
function levelHe(l){return ({correct:'מלא',partial:'חלקי',minimal:'מינימלי',incorrect:'לא תקין'})[l]||''}
function essayPrompt(E,T,n,ded){
  const crit=T.crit.map(([k,he,m])=>`- ${k} (${he}), max ${m}: levels correct=${m}, partially correct≈${k==='content'?Math.round(m*.7):k==='vocab'?Math.round(m*.6):Math.round(m*.62)}, minimally correct≈${Math.round(m*.3)}, incorrect=0. In-between marks are allowed.`).join('\n');
  return `You are a trained Israeli Bagrut English writing marker. Mark the student's text for ${T.name} using the official Ministry of Education writing rubric (${T.pts} points). Student: grade ${P.grade}, ${LEVELS[P.level].cefr}. Write the feedback in Hebrew, quote English exactly from the student's text.
TASK GIVEN TO THE STUDENT: ${E.topic[1]}
REQUIRED LENGTH: ${T.min}-${T.max} words. WORD COUNT: ${n}. (Length deduction of ${ded} points is applied by the system AFTER your marking. Mark as if the length were right, as the rubric instructs. Do not deduct for length yourself.)
RUBRIC CRITERIA:
- content: "Content and organization": on topic; fully developed main idea and supporting details; all elements of the task addressed; relevant information; understood; well organized and coherent. Deduct for lists, letter format when not asked, irrelevant "Hi, my name is..." openings, wrong tense for the task, an opinion that is missing or contradicted.
- vocab: "Vocabulary": correct use of varied and rich vocabulary; appropriate chunks, phrases, phrasal verbs, collocations; correct use of connecting words; appropriate register.
- language: "Language use": basic tenses and structures; advanced structures where suitable; word order; parts of speech, pronouns and prepositions.
- mech: "Mechanics": spelling, punctuation, capitalization, paragraphing, no run-on sentences.
MAX MARKS AND LEVELS:
${crit}
If the text is under ${T.cap} words, unrelated, incomprehensible or copied, all scores are 0.
Be honest but encouraging. Hebrew feedback must be clear, correct and gender-neutral (plural, infinitive or impersonal; never "אתה" or "את"), in short sentences. Any English you write must be natural and correct. Do not invent mistakes: every "fixes" item must quote a real fragment of the student's text. Give at most 8 fixes, choosing the most instructive and mixing grammar, vocabulary, spelling and organization.
STUDENT TEXT:
"""
${E.text}
"""
Return ONLY JSON:
{"scores":{"content":0,"vocab":0,"language":0,"mech":0},"levels":{"content":"correct|partial|minimal|incorrect","vocab":"...","language":"...","mech":"..."},"comments":{"content":"Hebrew, 2-3 sentences","vocab":"...","language":"...","mech":"..."},"strengths":["Hebrew"],"fixes":[{"original":"exact quote","corrected":"better version","why_he":"Hebrew explanation, name the rule"}],"focus":["3 concrete things to practise next, in Hebrew"],"improved_text":"the student's own text, corrected and polished while keeping their ideas and length","next_task_he":"one short follow-up exercise in Hebrew"}`;
}
async function gradeEssay(){
  const E=ui.essay,T=TRACKS[E.track],n=wordCount(E.text||''),ded=deduction(T,n);
  if(n<5){toast('צריך לכתוב טקסט קודם');return}
  E.busy=true;render();
  let R=null;
  if(sample){
    try{R=await sample.json(essayPrompt(E,T,n,ded),{modelTier:'complex',cache:false})}catch(e){R=null;toast(e&&e.code==='not_granted'?'כדי לקבל משוב צריך לאשר את הגישה ל-Claude':'לא הצלחנו להפיק משוב. אפשר לנסות שוב')}
  }
  E.busy=false;
  const res={n,ded,ai:false,scores:{},levels:{},comments:{},strengths:[],fixes:[],focus:[],zero:n<T.cap};
  if(R&&R.scores){
    res.ai=true;
    T.crit.forEach(([k,he,m])=>{const v=Number(R.scores[k]);res.scores[k]=Math.max(0,Math.min(m,isFinite(v)?Math.round(v*2)/2:0));res.levels[k]=R.levels&&R.levels[k];res.comments[k]=(R.comments&&R.comments[k])||''});
    res.strengths=(R.strengths||[]).slice(0,4);res.fixes=(R.fixes||[]).filter(f=>f&&f.original&&E.text.includes(f.original.slice(0,Math.min(12,f.original.length)))).slice(0,8);
    res.focus=(R.focus||[]).slice(0,3);res.improved=R.improved_text||'';res.next=R.next_task_he||'';
  }
  const raw=T.crit.reduce((s,[k])=>s+(res.scores[k]||0),0);
  res.total=res.ai?(res.zero?0:Math.max(0,raw-ded)):null;
  E.result=res;
  if(res.ai){
    P.essays=[{track:T.name,topic:E.topic[1],total:res.total,pts:T.pts,ts:Date.now(),text:E.text.slice(0,1800),scores:res.scores,ded,focus:res.focus}].concat(P.essays||[]).slice(0,5);
    persist();addXP(25,'כתיבה');
  }
  render();
  setTimeout(()=>{const r=document.getElementById('eres');if(r)r.scrollIntoView({behavior:'smooth',block:'start'})},50);
}
function essayResult(E,T){
  const r=E.result;
  const local=`<div class="card" id="eres"><h3>בדיקת אורך</h3><p>כתבת ${r.n} מילים. נדרש: ${T.min}–${T.max}.</p>${r.zero?`<p class="bad">פחות מ-${T.cap} מילים. לפי המחוון זה ציון אפס על המשימה.</p>`:r.ded?`<p class="bad">ניכוי על אורך לפי המחוון: ${r.ded} נקודות.</p>`:'<p class="ok">האורך תקין.</p>'}<p class="muted small">משוב מפורט לפי המחוון דורש חיבור ל-Claude.</p></div>`;
  if(!r.ai)return local;
  return `<div class="card pop" id="eres"><div class="row spread"><h2>הציון שלך</h2><div class="stat" style="text-align:left"><b>${r.total}/${T.pts}</b></div></div>
  ${r.ded?`<p class="small bad">כולל ניכוי של ${r.ded} נקודות על אורך (${r.n} מילים, נדרש ${T.min}–${T.max}).</p>`:`<p class="small muted">${r.n} מילים. אין ניכוי על אורך.</p>`}
  ${r.zero?'<p class="bad">פחות מ-'+T.cap+' מילים, ולכן ציון אפס לפי המחוון.</p>':''}
  <div style="margin-top:8px">${T.crit.map(([k,he,m])=>`<div class="crit"><div class="row spread"><b>${he}</b><span style="font-variant-numeric:tabular-nums"><b>${r.scores[k]}</b>/${m}${r.levels[k]?' · '+levelHe(r.levels[k]):''}</span></div><div class="bar"><i style="width:${Math.round(100*r.scores[k]/m)}%"></i></div><div class="small muted">${esc(r.comments[k])}</div></div>`).join('')}</div></div>
  ${r.strengths.length?`<div class="card"><h3>מה עובד טוב</h3><ul>${r.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
  ${r.focus.length?`<div class="card"><h3>על מה להתמקד כדי להשתפר</h3><ol>${r.focus.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${r.next?`<p style="margin-top:8px"><b>תרגיל להמשך:</b> ${esc(r.next)}</p>`:''}</div>`:''}
  ${r.fixes.length?`<div class="card"><h3>תיקונים</h3>${r.fixes.map(f=>`<div class="fix"><div class="en bad">✗ ${esc(f.original)}</div><div class="en ok">✓ ${esc(f.corrected)}</div><div class="small muted">${esc(f.why_he)}</div></div>`).join('')}</div>`:''}
  ${r.improved?`<details class="card"><summary><b>גרסה משופרת של הטקסט שלך</b></summary><p class="en" style="white-space:pre-wrap;margin-top:10px">${esc(r.improved)}</p><p class="muted small" style="margin-top:8px">כדאי לקרוא את הגרסה ולהשוות. לא מעתיקים אותה לבגרות: כותבים מחדש במילים שלכם.</p></details>`:''}
  <div class="row"><button class="btn" data-act="rewrite">כתיבה מחדש</button><button class="btn ghost" data-act="newtopic">נושא חדש</button></div>`;
}

/* ======================================================= מבט מורה ======================================================= */
function teacherHTML(){
  if(mode!=='cloud')return `<div class="banner">מבט המורה זמין כשהאתר פועל עם שמירה בענן. כרגע הוא פועל במצב מקומי.</div>`;
  if(!roster.length)return `<h2>התלמידים שלי</h2><p class="muted">עדיין אין תלמידים. אחרי שתלמיד יפתח את הקישור, ייכנס ויתחיל לתרגל, הוא יופיע כאן.</p>`;
  const rows=roster.slice().sort((a,b)=>(b.updated||0)-(a.updated||0));
  return `<h2>התלמידים שלי (${rows.length})</h2>
  <div class="tblwrap" style="margin:12px 0 24px"><table><thead><tr><th>שם</th><th>כיתה</th><th>רמה</th><th>XP</th><th>רצף</th><th>יחידות</th><th>ממוצע</th><th>כתיבה אחרונה</th><th>פעילות אחרונה</th></tr></thead><tbody>
  ${rows.map(p=>{const m=mastered(p),a=avg(p),e=(p.essays||[])[0];return `<tr><td>${esc(p.name||'ללא שם')}</td><td>${esc(p.grade||'')}</td><td>${LEVELS[p.level]?LEVELS[p.level].name:''}</td><td>${p.xp||0}</td><td>${p.streak?p.streak.n:0}</td><td>${m}/${UNITS.length}</td><td>${a===null?'—':a+'%'}</td><td>${e?e.total+'/'+e.pts:'—'}</td><td>${when(p.updated)}</td></tr>`}).join('')}
  </tbody></table></div>
  <h3>פירוט לפי תלמיד</h3>
  ${rows.map(p=>`<details class="st"><summary><b>${esc(p.name||'ללא שם')}</b><span class="muted small">כיתה ${esc(p.grade||'')} · ${p.xp||0} XP · ${mastered(p)}/${UNITS.length} יחידות</span></summary>
   <div style="padding:10px 0;display:grid;gap:6px">${UNITS.filter(u=>u.kind!=='write').map(u=>{const r=(p.units||{})[u.id];return `<div class="row spread small"><span>${esc(u.title)} <span class="muted">· ${LEVELS[u.lvl].cefr}</span></span><span>${r?pct(r)+'% (ניסיונות: '+r.attempts+')':'—'}</span></div>`}).join('')}
   <div class="small muted">מילים שנלמדו: ${Object.values(p.vocab||{}).filter(v=>v>=2).length} · נושאים שחיפש: ${(p.topics||[]).slice(0,5).map(t=>esc(t.t)).join(', ')||'—'}<br>מסלולים: ${Object.values(p.paths||{}).map(x=>esc(x.title)+' (שלב '+x.stage+')').join(', ')||'—'}</div></div>
   ${(p.essays||[]).map(e=>`<div class="card" style="margin-top:10px"><div class="small muted">${esc(e.track)} · ${when(e.ts)} · ציון ${e.total}/${e.pts}${e.ded?' (ניכוי אורך '+e.ded+')':''}</div><div class="small en" style="margin-top:4px"><b>${esc(e.topic)}</b></div><div class="en" style="white-space:pre-wrap;margin-top:6px">${esc(e.text)}</div>${(e.focus||[]).length?`<div class="small" style="margin-top:6px">להתמקד: ${e.focus.map(esc).join(' · ')}</div>`:''}</div>`).join('')}
   ${UNITS.filter(u=>u.kind==='write'&&p.writing&&p.writing[u.id]&&p.writing[u.id].text).map(u=>`<div class="card" style="margin-top:10px"><div class="small muted">${esc(u.title)} · ${when(p.writing[u.id].ts)}</div><div class="en" style="white-space:pre-wrap;margin-top:6px">${esc(p.writing[u.id].text)}</div></div>`).join('')}
  </details>`).join('')}`;
}

/* ======================================================= אירועים ======================================================= */
function leave(){ui.stage=null;ui.lesson=null;ui.quiz=null;ui.write=null;ui.game=null;stopTimer();render();window.scrollTo(0,0)}
app.addEventListener('change',e=>{if(e.target.id==='gs'){ui.gsrc=e.target.value;render()}});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v,g=ui.game;
  switch(a){
   case 'copyexp':{const t=exportText();const m=document.getElementById('xmsg');const ok=()=>{if(m)m.textContent='הסיכום הועתק.'};const fb=()=>{const x=document.getElementById('xs');if(x){x.focus();x.select();if(m)m.textContent='סמנו והעתיקו ידנית.'}};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}break}
   case 'skin':P.skin=v;persist();render();break;
   case 'theme':P.theme=v;persist();render();break;
   case 'stexit':ui.stage=null;render();window.scrollTo(0,0);break;
   case 'pathgo':{
     if(v.startsWith('u:')){const u=UNITS.find(x=>x.id===v.slice(2));if(u){const pa=ensurePath(v,u.title,unitTopic(u));if(!pa.seen.length)addSeen(pa,u.qs.map(q=>q.q))}}
     if(!P.paths[v]){toast('המסלול לא נמצא');break}
     const st=pathStage(v);
     if(st>=STAGE_MAX){toast('השלמתם את כל השלבים בנושא הזה');break}
     startStage(v,st+1);break}
   case 'sgpick':{const S=ui.stage;if(S.picked!==null)return;S.picked=+v;if(S.qs[S.qi].o[+v].ok)S.score++;render();break}
   case 'sgnext':{const S=ui.stage;S.qi++;S.picked=null;if(S.qi>=S.qs.length)finishStage();render();window.scrollTo(0,0);break}
   case 'tab':ui.view=v;render();window.scrollTo(0,0);break;
   case 'lvl':ui.lvl=+v;render();break;
   case 'vband':ui.vband=+v;render();break;
   case 'tcat':ui.topicCat=ui.topicCat===v?'':v;render();break;
   case 'topic':startLesson(v);break;
   case 'open':openUnit(v);break;
   case 'home':ui.quiz=null;ui.write=null;render();break;
   case 'leave':leave();break;
   case 'editprofile':ui.edit=true;render();break;
   case 'cancel':ui.edit=false;render();break;
   case 'retry':openUnit(v);break;
   case 'pick':{const z=ui.quiz;if(z.picked!==null)return;z.picked=+v;if(z.items[z.i].o[+v].ok)z.score++;render();break}
   case 'next':{const z=ui.quiz;z.i++;z.picked=null;if(z.i>=z.items.length)finishQuiz();render();window.scrollTo(0,0);break}
   case 'savew':{
     const w=ui.write;P.writing=P.writing||{};
     if(!w.text.trim()){document.getElementById('wmsg').textContent='צריך לכתוב טקסט קודם.';return}
     P.writing[w.u.id]={text:w.text,checks:w.checks,ts:Date.now()};persist();addXP(15,'כתיבה');
     document.getElementById('wmsg').textContent=mode==='cloud'?'נשמר ונשלח למורה.':'נשמר במכשיר הזה.';break}
   /* שיעור */
   case 'lpick':{const L=ui.lesson;if(L.picked!==null)return;L.picked=+v;if(L.quiz[L.qi].o[+v].ok)L.score++;renderLesson();break}
   case 'lnext':{const L=ui.lesson;L.qi++;L.picked=null;if(L.qi>=L.quiz.length){L.done=true;const pa=P.paths[slug(L.topic)];L.res=recordStage(slug(L.topic),1,L.score,L.quiz.length,pa.title,pa.topic);addXP(L.res.xp,'שלב 1');if(L.res.pass)celebrate({k:'stage',t:'שלב 1 הושלם: '+STAGES[0][0],s:L.res.stars+' כוכבים מתוך 3'});persist();checkAch()}renderLesson();break}
   case 'lretry':{const L=ui.lesson;L.qi=0;L.picked=null;L.score=0;L.done=false;L.quiz=L.quiz.map(q=>Object.assign({},q,{o:shuffle(q.o)}));renderLesson();break}
   /* משחקים */
   case 'gostart':{const [k,s]=v.split('|');startGame(k,s);break}
   case 'gexit':ui.game=null;stopTimer();render();break;
   case 'say':say(v);break;
   case 'bpick':bpick(+v);break;
   case 'gpick':{if(g.picked!==null)return;g.picked=+v;const ok=g.items[g.i].o[+v].ok;if(ok){g.right++;const w=g.items[g.i].w;if(w)P.vocab[w]=Math.min(3,known(w)+1);g.chests=null}else{g.mult=1;if(!g.items[g.i].again)g.items.push(redo(g.src,g.items[g.i]))}render();
     if(ok){setTimeout(()=>{if(ui.game!==g)return;const ch=shuffle(CHESTS).slice(0,3).map(c=>Object.assign({},c,{open:false}));g.chests=ch;g.opened=false;g.picked=null;render()},700)}break}
   case 'chest':{const c=g.chests[+v];if(g.opened)return;const was=g.mult;c.f(g);if(was>1&&c.t.includes('זהב'))g.mult=1;g.opened=true;g.chests.forEach((x,k)=>{x.open=true});render();break}
   case 'gnext':{g.bot+=Math.floor(25+Math.random()*55);g.i++;g.picked=null;g.chests=null;g.opened=false;if(g.i>=g.items.length)endGame();else render();break}
   case 'flip':g.flip=!g.flip;render();break;
   case 'knew':{const c=g.deck.shift();g.knownN++;P.vocab[c[0]]=Math.min(3,known(c[0])+1);g.flip=false;persist();render();break}
   case 'again':{const c=g.deck.shift();g.deck.push(c);g.again++;g.flip=false;render();break}
   case 'mpick':{
     if(g.lock||g.over)return;const i=+v,t=g.tiles[i];if(t.done||g.sel===i)return;
     if(!g.t0)g.t0=Date.now();
     if(g.sel===null){g.sel=i;render();break}
     const o=g.tiles[g.sel];g.moves++;
     if(o.k===t.k&&o.l!==t.l){o.done=t.done=true;g.done++;g.sel=null;if(g.done===g.tiles.length/2){g.sec=Math.floor((Date.now()-g.t0)/1000);endGame()}else render()}
     else{g.bad=[g.sel,i];g.lock=true;g.sel=null;render();setTimeout(()=>{g.bad=null;g.lock=false;if(ui.game===g)render()},600)}
     break}
   case 'hint':g.hint=true;render();break;
   case 'snext':{g.i++;g.tries=0;g.hint=false;g.fb=null;if(g.i>=g.w.length)endGame();else render();break}
   /* כתיבה לבגרות */
   case 'track':ui.essay=Object.assign({},ui.essay||{},{track:v,topic:null,text:'',result:null});render();break;
   case 'newtopic':{const tr=(ui.essay&&ui.essay.track)||(P.level===3?'G':P.level===2?'D':'C');const bank=WTOPICS[(tr==='C'||tr==='D')?'CD':'FG'];ui.essay={track:tr,topic:pick(bank),text:'',result:null};render();break}
   case 'grade':gradeEssay();break;
   case 'rewrite':ui.essay.result=null;render();window.scrollTo(0,0);break;
  }
});
init();
</script>
